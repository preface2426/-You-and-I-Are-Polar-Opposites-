<path d="M52 155L762 155 690 277 155 277Z" fill="#778782"/><path d="M52 155L762 155M85 174L731 174M119 196L704 196M151 220L680 220M178 247L660 247" stroke="#4e625f" stroke-width="4"/><path d="M90 155L180 277M245 155L270 277M400 155L400 277M555 155L530 277M710 155L640 277" stroke="#526562" stroke-width="6"/><path d="M175 277V435m355-158v158" stroke="#667773" stroke-width="18"/><path d="M168 277h20m332 0h30" stroke="#40514e" stroke-width="5"/>
<!-- bench -->
<path d="M234 411h120v14H234zm10-24h10v24h-10zm91 0h10v24h-10z" fill="#57795e"/>
<!-- train distant -->
<g><rect x="576" y="330" width="112" height="67" rx="14" fill="url(#train)" stroke="#64736e" stroke-width="3"/><rect x="588" y="342" width="35" height="27" rx="5" fill="#8fc1d2"/><rect x="630" y="342" width="35" height="27" rx="5" fill="#8fc1d2"/><path d="M576 382h112" stroke="#6f9c7a" stroke-width="8"/></g>
<text x="75" y="536" class="small">屋顶钢桁架</text><text x="557" y="523" class="small">黄线：触觉警示带</text><text x="493" y="343" class="small">站台端栏杆</text>

<!-- panel B reverse -->
<rect x="818" y="105" width="750" height="480" rx="12" class="panel"/><text x="841" y="138" class="head">B｜站台反向视角（看向楼梯／扶梯与站厅）</text>
<rect x="838" y="155" width="710" height="395" fill="url(#sky)"/>
<g fill="#d1dddd"><rect x="844" y="265" width="120" height="155"/><rect x="968" y="226" width="89" height="194"/><rect x="1382" y="245" width="160" height="175"/></g>
<!-- concourse block and access -->
<rect x="1172" y="208" width="286" height="172" fill="#e9e6d6" stroke="#78837b" stroke-width="4"/><rect x="1200" y="228" width="226" height="37" fill="#c4d7d8"/><path d="M1185 296h259" stroke="#829089" stroke-width="5"/><text x="1250" y="254" class="small">站厅／检票层（推定）</text>
<path d="M1191 376L1330 276M1210 382L1348 282" stroke="#526865" stroke-width="12"/><path d="M1200 374l12-8m11-8 12-8m11-8 12-8m11-8 12-8m11-8 12-8m11-8 12-8m11-8 12-8" stroke="#d1c6a7" stroke-width="3"/>
<path d="M1360 377L1450 300M1376 382L1466 305" stroke="#667874" stroke-width="9"/><path d="M1367 369l12 7m5-19 12 7m5-19 12 7m5-19 12 7m5-19 12 7" stroke="#eee4c6" stroke-width="3"/>
<!-- platform and roof -->
<path d="M838 402H1548" stroke="#869590" stroke-width="5"/><path d="M838 437L1548 437V550H838Z" fill="url(#floor)"/><path d="M838 437L1548 437V550H838Z" fill="url(#tiles)"/><path d="M838 432h710" stroke="#e8c638" stroke-width="11"/><path d="M838 155h710l-30 125H862z" fill="#788782"/><path d="M850 177h690M860 206h670M870 238h650M878 267h635" stroke="#4e625f" stroke-width="4"/><path d="M930 155v284m179-284v284m177-284v284m177-284v284" stroke="#586d68" stroke-width="13"/>
<path d="M838 415h710" stroke="#879591" stroke-width="3"/><path d="M860 397v40m38-40v40m38-40v40m38-40v40m38-40v40m38-40v40" stroke="#84938e" stroke-width="3"/>
<text x="850" y="526" class="small">站台有效长度沿线路延伸；两端留有安全栏杆与设备区</text>

<!-- panel C site plan -->
<rect x="32" y="605" width="750" height="255" rx="12" class="panel"/><text x="55" y="638" class="head">C｜站台与轨道平面关系（概略）</text>
<rect x="92" y="679" width="628" height="126" rx="8" fill="#d6d8d0" stroke="#89958f" stroke-width="2"/><rect x="109" y="691" width="590" height="34" fill="#5d6666"/><rect x="109" y="757" width="590" height="34" fill="#5d6666"/><path d="M109 705h590m-590 52h590" stroke="#c6c4b5" stroke-width="4" stroke-dasharray="18 9"/><rect x="109" y="727" width="590" height="30" fill="#d8ddd0" stroke="#89958f"/><path d="M121 748h566" stroke="#e9c73b" stroke-width="8"/><rect x="377" y="730" width="70" height="22" fill="#78867f"/><text x="347" y="716" class="small">雨棚覆盖区</text><text x="92" y="676" class="small">轨道 A</text><text x="92" y="819" class="small">轨道 B</text><text x="467" y="744" class="small">岛式站台示意，非精确站型测绘</text>

<!-- panel D train side -->
<rect x="818" y="605" width="750" height="255" rx="12" class="panel"/><text x="841" y="638" class="head">D｜列车外观（站台侧立面）</text>
<path d="M872 790V704Q872 672 904 672H1470Q1515 672 1515 710V790Z" fill="url(#train)" stroke="#687773" stroke-width="4"/><path d="M872 755H1515" stroke="#6f9d79" stroke-width="13"/><path d="M890 690h86v58h-86zm104 0h86v58h-86zm104 0h86v58h-86zm104 0h86v58h-86zm104 0h86v58h-86" fill="#91bac8" stroke="#536562" stroke-width="4"/><path d="M1088 690v99m192-99v99" stroke="#78867e" stroke-width="5"/><circle cx="958" cy="794" r="15" fill="#384544"/><circle cx="1418" cy="794" r="15" fill="#384544"/><text x="894" y="835" class="small">浅色车体＋绿色腰线为配色概念；具体车型未确认</text>

<!-- panel E cabin side -->
<rect x="32" y="880" width="750" height="280" rx="12" class="panel"/><text x="55" y="913" class="head">E｜车厢内部纵向视图（无人）</text>
<rect x="64" y="935" width="684" height="176" rx="15" fill="#e6e2d4" stroke="#697773" stroke-width="4"/><rect x="80" y="951" width="652" height="72" fill="#a8c9d3" stroke="#667773" stroke-width="3"/><path d="M160 952v70m80-70v70m80-70v70m80-70v70m80-70v70m80-70v70m80-70v70" stroke="#788884" stroke-width="3"/>
<rect x="80" y="1037" width="652" height="52" fill="#5e865f" stroke="#526c56" stroke-width="3"/><path d="M80 1037h652" stroke="#405845" stroke-width="5"/><path d="M95 1089v22m615-22v22" stroke="#65736b" stroke-width="8"/><path d="M110 937v23m62-23v23m62-23v23m62-23v23m62-23v23m62-23v23m62-23v23m62-23v23m62-23v23m62-23v23" stroke="#75817d" stroke-width="2"/>
<g fill="none" stroke="#687874" stroke-width="4"><path d="M132 940v27m-12 0 12 12 12-12M208 940v27m-12 0 12 12 12-12M284 940v27m-12 0 12 12 12-12M360 940v27m-12 0 12 12 12-12M436 940v27m-12 0 12 12 12-12M512 940v27m-12 0 12 12 12-12M588 940v27m-12 0 12 12 12-12M664 940v27m-12 0 12 12 12-12"/></g><text x="78" y="1141" class="small">两侧纵向长椅｜大窗｜三角吊环｜车门与车端连接为常见通勤车厢配置</text>

<!-- panel F end view -->
<rect x="818" y="880" width="750" height="280" rx="12" class="panel"/><text x="841" y="913" class="head">F｜车厢横截面／车端观察（无人）</text>
<path d="M1000 1115V980Q1000 941 1039 941H1350Q1388 941 1388 980V1115Z" fill="#e8e4d7" stroke="#697773" stroke-width="4"/><rect x="1020" y="960" width="116" height="84" rx="12" fill="#a6cbd5" stroke="#657772" stroke-width="3"/><rect x="1252" y="960" width="116" height="84" rx="12" fill="#a6cbd5" stroke="#657772" stroke-width="3"/><path d="M1020 1060h116v42h-116zm232 0h116v42h-116z" fill="#5f875f" stroke="#526d56" stroke-width="3"/><path d="M1194 955v128" stroke="#9ca79c" stroke-width="3"/><rect x="1162" y="960" width="64" height="124" fill="#d5d0c2" stroke="#727c75" stroke-width="3"/><path d="M1105 944v24m-10 0 10 10 10-10m168-24v24m-10 0 10 10 10-10" fill="none" stroke="#687874" stroke-width="4"/><text x="1010" y="1141" class="small">车门居中、两侧座椅与窗户为概念推定；不同线路和车型会有差异</text>
<text x="42" y="1185" class="small">注：生成目标是可读的空间设定草图；轨道数、站台型式、出入口位置与车型并无足够截图依据，均以概念化表达呈现。</text>
</svg>
