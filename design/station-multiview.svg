<!-- platform floor -->
<path d="M52 435L762 435 762 550 52 550Z" fill="url(#floor)"/><path d="M52 435L762 435 762 550 52 550Z" fill="url(#tiles)"/><path d="M566 432L628 432 762 550 694 550Z" fill="#e9c93b"/><path d="M545 432L554 432 673 550 663 550Z" fill="#b9d874"/>
