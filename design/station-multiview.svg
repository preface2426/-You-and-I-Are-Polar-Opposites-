<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#e6f3f7"/><stop offset="1" stop-color="#fbf6e8"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#c7c8bd"/><stop offset="1" stop-color="#8c9992"/></linearGradient>
 <linearGradient id="train" x2="0" y2="1"><stop stop-color="#f4f1df"/><stop offset="1" stop-color="#d9ddcf"/></linearGradient>
 <pattern id="tiles" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#75847e" stroke-width="1" opacity=".38"/></pattern>
 <style>.title{font:700 30px sans-serif;fill:#263744}.sub{font:15px sans-serif;fill:#60717b}.head{font:700 19px sans-serif;fill:#304651}.label{font:13px sans-serif;fill:#42545d}.small{font:11px sans-serif;fill:#596a71}.panel{fill:#fffdf8;stroke:#bec8c5;stroke-width:2}.line{stroke:#64777d;stroke-width:2;fill:none}</style>
</defs>
<rect width="1600" height="1200" fill="#edf1ee"/>
<text x="42" y="49" class="title">高架通勤站｜无人场景多视角设定图</text>
<text x="43" y="77" class="sub">以截图中的钢构雨棚、黄色触觉铺装、绿色长椅列车为依据；空间连接与未见区域为合理推定，非官方车站复原图。</text>

<!-- panel A -->
<rect x="32" y="105" width="750" height="480" rx="12" class="panel"/><text x="55" y="138" class="head">A｜站台纵深全景（从端部看向站台中段）</text>
<rect x="52" y="155" width="710" height="395" fill="url(#sky)"/>
<!-- distant city -->
<g fill="#cbd9d9" opacity=".8"><rect x="62" y="260" width="85" height="160"/><rect x="153" y="215" width="88" height="205"/><rect x="248" y="282" width="78" height="138"/><rect x="562" y="235" width="68" height="185"/><rect x="638" y="270" width="106" height="150"/></g><g stroke="#f7f5ec" stroke-width="6" opacity=".8"><path d="M70 292h68m-68 30h68m-68 30h68M164 250h66m-66 34h66m-66 34h66M571 270h51m-51 34h51m-51 34h51M648 305h85m-85 34h85"/></g>
<!-- fences and track -->
