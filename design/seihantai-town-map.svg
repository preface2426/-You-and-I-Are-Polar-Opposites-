<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<rect width="1200" height="820" fill="#f7f5ef"/><text x="42" y="52" font-size="30" font-family="sans-serif" font-weight="bold" fill="#263342">《正反对的你与我》生活圈推定图</text><text x="42" y="82" font-size="16" font-family="sans-serif" fill="#586574">依据漫画中的通学、朋友与日常动线作相对关系推测；无官方区域图／住址／比例。动画现实取景点另作参照。</text>
<rect x="35" y="112" width="820" height="665" rx="20" fill="#eef3e9" stroke="#a9b9ab"/><text x="65" y="151" font-size="22" font-family="sans-serif" font-weight="bold" fill="#39594a">故事日常生活圈（相对位置示意）</text>
<!-- zones -->
<ellipse cx="210" cy="320" rx="135" ry="104" fill="#f9dfd8" stroke="#cf8a78" stroke-width="2"/><text x="117" y="290" font-size="19" font-family="sans-serif" font-weight="bold" fill="#71443b">A片区</text><text x="117" y="318" font-size="16" font-family="sans-serif" fill="#71443b">铃木・山田・佐藤</text><text x="117" y="343" font-size="14" font-family="sans-serif" fill="#71443b">同一中学背景（漫画推定）</text>
<ellipse cx="650" cy="320" rx="138" ry="104" fill="#dceaf5" stroke="#83a6be" stroke-width="2"/><text x="566" y="290" font-size="19" font-family="sans-serif" font-weight="bold" fill="#35566d">B片区</text><text x="566" y="318" font-size="16" font-family="sans-serif" fill="#35566d">谷的居住片区（推定）</text><text x="566" y="343" font-size="14" font-family="sans-serif" fill="#35566d">漫画提及家附近生活动线</text>
<ellipse cx="430" cy="584" rx="120" ry="84" fill="#f5edcf" stroke="#c9b66f" stroke-width="2"/><text x="386" y="565" font-size="18" font-family="sans-serif" font-weight="bold" fill="#665a2f">C片区</text><text x="370" y="592" font-size="15" font-family="sans-serif" fill="#665a2f">渡边等其他角色</text><text x="370" y="615" font-size="13" font-family="sans-serif" fill="#665a2f">住区/中学区仅为推测</text>
<!-- school parcel -->
<rect x="330" y="222" width="200" height="140" rx="10" fill="#d7e8d2" stroke="#507b58" stroke-width="3"/><text x="369" y="265" font-size="19" font-family="sans-serif" font-weight="bold" fill="#31553a">高中校园</text><text x="355" y="292" font-size="14" font-family="sans-serif" fill="#31553a">相对占地较大</text><text x="355" y="314" font-size="13" font-family="sans-serif" fill="#31553a">校舍・操场・通学门</text><text x="355" y="338" font-size="12" font-family="sans-serif" fill="#31553a">漫画未给精确校址</text>
<!-- routes -->
<path d="M290 322 C320 322 324 290 330 290" fill="none" stroke="#d27669" stroke-width="5" stroke-dasharray="9 7"/><path d="M530 290 C550 294 548 322 512 322" fill="none" stroke="#5988a6" stroke-width="5" stroke-dasharray="9 7"/><text x="290" y="390" font-size="14" font-family="sans-serif" fill="#5c6064">通学方向（非比例；角色路线未逐户确认）</text>
<path d="M430 362 L430 493" fill="none" stroke="#8c8c82" stroke-width="3" stroke-dasharray="6 7"/><circle cx="430" cy="454" r="12" fill="#e6a753"/><text x="450" y="460" font-size="15" font-family="sans-serif" fill="#604a2b">车站／商店街／便利店等日常节点</text><text x="450" y="483" font-size="12" font-family="sans-serif" fill="#6e6e6e">漫画场景组合推定，非同一已核实地标</text>
<!-- anime inset -->
<rect x="880" y="112" width="285" height="665" rx="20" fill="#eef0f7" stroke="#b0b8ce"/><text x="907" y="151" font-size="21" font-family="sans-serif" font-weight="bold" fill="#3b4666">动画现实取景参照</text>
<g font-family="sans-serif" fill="#263342"><circle cx="914" cy="203" r="9" fill="#e66f7c"/><text x="935" y="209" font-size="16">赤田东公园／步道桥</text><text x="935" y="230" font-size="13">第1话告白场景参考</text><circle cx="914" cy="272" r="9" fill="#4e8c76"/><text x="935" y="278" font-size="16">山内图书馆・地区中心</text><text x="935" y="299" font-size="13">第5话／あざみ野周边</text><circle cx="914" cy="340" r="9" fill="#7184c4"/><text x="935" y="346" font-size="16">横滨翠岚高中</text><text x="935" y="367" font-size="13">制作协力参考；非故事校址</text><circle cx="914" cy="409" r="9" fill="#4c99b5"/><text x="935" y="415" font-size="16">山下公园・港见丘公园</text><text x="935" y="436" font-size="13">第12话约会／港湾南部</text><circle cx="914" cy="478" r="9" fill="#bd6e9b"/><text x="935" y="484" font-size="16">中华街・港未来</text><text x="935" y="505" font-size="13">横滨市中心外出地点</text><line x1="907" y1="548" x2="1137" y2="548" stroke="#bdc3d2"/><text x="907" y="581" font-size="15">漫画角色住宅只画片区，</text><text x="907" y="606" font-size="15">不推测门牌、楼栋或精确点位。</text><text x="907" y="651" font-size="14" fill="#586574">圈的大小表示相对生活范围，</text><text x="907" y="674" font-size="14" fill="#586574">不代表面积或真实行政区边界。</text></g>
</svg>
